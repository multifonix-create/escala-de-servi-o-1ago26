<div class="form-grid">
  <label>
    <span>Nome</span>
    <input type="text" name="first_name" value="{{ form_data.get('first_name', '') }}" maxlength="90" required autocomplete="off" aria-describedby="first-name-error">
    {% if errors.get("first_name") %}
      <small id="first-name-error" class="field-error">{{ errors["first_name"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Sobrenome</span>
    <input type="text" name="last_name" value="{{ form_data.get('last_name', '') }}" maxlength="120" required autocomplete="off" aria-describedby="last-name-error">
    {% if errors.get("last_name") %}
      <small id="last-name-error" class="field-error">{{ errors["last_name"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>NIM</span>
    <input type="text" name="nim" value="{{ form_data.get('nim', '') }}" maxlength="30" required autocomplete="off" inputmode="numeric" aria-describedby="nim-error">
    {% if errors.get("nim") %}
      <small id="nim-error" class="field-error">{{ errors["nim"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Contacto</span>
    <input type="text" name="phone_number" value="{{ form_data.get('phone_number', '') }}" maxlength="20" required autocomplete="off" placeholder="912345678 ou +351912345678" aria-describedby="phone-number-error">
    {% if errors.get("phone_number") %}
      <small id="phone-number-error" class="field-error">{{ errors["phone_number"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Tipo funcional</span>
    <select name="functional_type" required aria-describedby="functional-type-error">
      <option value="">Selecionar</option>
      {% for item in functional_types %}
        <option value="{{ item.value }}" {% if form_data.get('functional_type') == item.value %}selected{% endif %}>{{ functional_type_labels[item.value] }}</option>
      {% endfor %}
    </select>
    {% if errors.get("functional_type") %}
      <small id="functional-type-error" class="field-error">{{ errors["functional_type"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Equipa operacional</span>
    <select name="team_id" aria-describedby="team-id-error">
      <option value="">Sem equipa operacional</option>
      {% for team in teams %}
        <option value="{{ team.id }}" {% if form_data.get('team_id') == team.id|string %}selected{% endif %}>Equipa {{ team.code }}</option>
      {% endfor %}
    </select>
    {% if errors.get("team_id") %}
      <small id="team-id-error" class="field-error">{{ errors["team_id"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Data de início</span>
    <input type="date" name="start_date" value="{{ form_data.get('start_date', '') }}" required aria-describedby="start-date-error">
    {% if errors.get("start_date") %}
      <small id="start-date-error" class="field-error">{{ errors["start_date"] }}</small>
    {% endif %}
  </label>

  <label>
    <span>Data de fim</span>
    <input type="date" name="end_date" value="{{ form_data.get('end_date', '') }}" aria-describedby="end-date-error">
    {% if errors.get("end_date") %}
      <small id="end-date-error" class="field-error">{{ errors["end_date"] }}</small>
    {% endif %}
  </label>

  <label class="checkbox-field">
    <input type="checkbox" name="is_active" value="1" {% if form_data.get('is_active') %}checked{% endif %}>
    <span>Militar ativo</span>
  </label>

  <label class="checkbox-field">
    <input type="checkbox" name="is_paid_service_volunteer" value="1" {% if form_data.get('is_paid_service_volunteer') %}checked{% endif %}>
    <span>Voluntário para serviços remunerados</span>
  </label>

  <label class="full-width">
    <span>Notas</span>
    <textarea name="notes" rows="5" maxlength="2000" aria-describedby="notes-error">{{ form_data.get('notes', '') }}</textarea>
    {% if errors.get("notes") %}
      <small id="notes-error" class="field-error">{{ errors["notes"] }}</small>
    {% endif %}
  </label>
</div>
